<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - Lunar Proxy</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/index.css">
  <style>
    .donate-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:110px 20px 40px;box-sizing:border-box}
    .donate-card{width:min(680px,100%);padding:42px;border-radius:24px;background:var(--background-secondary);border:1px solid var(--border-color);box-shadow:0 18px 60px rgba(0,0,0,.18);text-align:center}
    .donate-icon{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:30px}
    .donate-card h1{margin:0 0 12px;font-size:34px}
    .donate-card p{margin:0 auto 12px;max-width:560px;color:var(--text-primary);line-height:1.65}
    .donate-note{margin-top:24px;padding:16px;border-radius:14px;background:var(--background-primary);color:var(--text-primary);font-size:14px}
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <main class="donate-page">
    <section class="donate-card">
      <div class="donate-icon"><i class="fa-solid fa-heart"></i></div>
      <h1>Support Lunar Proxy</h1>
      <p>Thanks for wanting to support Lunar Proxy. Donations help with hosting, development, and keeping the project running.</p>
      <div class="donate-note">If you would like to support Lunar Proxy, you can send a donation through Cash App.</div><div style="margin-top:20px;font-size:22px;font-weight:700;color:var(--text-primary)">Cash App: $Trafficone1</div>
    </section>
  </main>
  <script src="/assets/js/main.js"></script>
</body>
</html>
