<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS Profile</title><link rel="stylesheet" href="/assets/css/global.css"><link rel="stylesheet" href="/assets/css/nav.css"><link rel="stylesheet" href="/assets/css/lunar.css"><link rel="stylesheet" href="/assets/css/community.css"><script src="/assets/js/storage.js"></script><script src="/assets/js/main.js"></script></head><body class="lunar-community-page"><div class="nav-bar"></div><main class="account-shell"><section class="account-card profile-public-card"><div class="profile-public-banner" id="banner"></div><div class="profile-public-body"><div class="profile-avatar profile-public-avatar" id="avatar"></div><div class="profile-public-name"><h1 id="name">Loading...</h1><span id="owner" class="profile-owner-badge" hidden>OWNER OF LS</span></div><p class="profile-public-username" id="username"></p><p class="profile-public-status" id="status"></p><p class="profile-public-bio" id="bio"></p><div class="profile-role-list" id="roles"></div><div class="profile-discord" id="discord" hidden><strong>Discord connected</strong><span id="discordName"></span></div><a class="profile-back" href="/chat">Back to chat</a></div></section></main><script>(async()=>{const esc=v=>{const d=document.createElement("div");d.textContent=v||"";return d.innerHTML};const n=v=>(v||"?").slice(0,2).toUpperCase();const u=decodeURIComponent(location.pathname.split("/").pop()||"");try{const r=await fetch("/api/users/"+encodeURIComponent(u));const d=await r.json();if(!r.ok)throw Error(d.error||"Profile not found");const x=d.user;document.title=(x.displayName||x.username)+" · LS";document.getElementById("name").textContent=x.displayName;document.getElementById("username").textContent="@"+x.username;document.getElementById("status").textContent=x.status||"";document.getElementById("bio").textContent=x.bio||"";document.getElementById("avatar").innerHTML=x.avatarUrl?'<img src="'+esc(x.avatarUrl)+'" alt="">':esc(n(x.displayName));if(x.bannerUrl)document.getElementById("banner").style.backgroundImage='url("'+x.bannerUrl+'")';document.getElementById("owner").hidden=!x.isOwner;document.getElementById("roles").innerHTML=(x.roles||[]).map(z=>'<span class="profile-role '+(z==="Owner"?"owner":"")+'">'+esc(z)+'</span>').join("");if(x.discordConnected){document.getElementById("discord").hidden=false;document.getElementById("discordName").textContent=x.discordUsername||""}}catch(e){document.getElementById("name").textContent="Profile not found";document.getElementById("username").textContent=e.message}})();</script></body></html>
