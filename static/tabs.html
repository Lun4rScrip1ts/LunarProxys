<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Home</title>
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/tabs.css" />
  <script src="/assets/js/storage.js?v=lunar7"></script>
  <script src="/assets/js/main.js?v=lunar15"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/lunar.css?v=lunar9">
  <style>
    /* Keep Spotify visibly available in the browser chrome. */
    body#no > .browser-bar .spotify-browser-link {
      display:inline-flex!important;
      align-items:center!important;
      justify-content:center!important;
      gap:7px!important;
      flex:0 0 auto!important;
      min-width:88px!important;
      width:auto!important;
      height:34px!important;
      padding:0 13px!important;
      margin:0 6px 0 0!important;
      border:1px solid rgba(255,255,255,.12)!important;
      border-radius:10px!important;
      background:rgba(255,255,255,.06)!important;
      color:rgba(255,255,255,.8)!important;
      text-decoration:none!important;
      font:600 12px Inter,sans-serif!important;
      box-sizing:border-box!important;
    }
    body#no > .browser-bar .spotify-browser-link i {font-size:16px!important;}
    body#no > .browser-bar .spotify-browser-link:hover {
      transform:none!important;
      background:rgba(140,122,255,.18)!important;
      border-color:rgba(140,122,255,.38)!important;
      color:#fff!important;
    }
  </style>
</head>

<body id="no">
  <nav class="browser" id="right-side-nav">
    <ul id="tab-list"></ul>
    <button title="add-tab" id="add-tab"><i class="fa-solid fa-plus"></i></button>
  </nav>
  <div class="browser-bar">
    <div class="browser-container">
      <div class="browser-left">
        <button title="Home Page" id="home-page" class="browser-button" onclick="goHome()"><i class="fa-solid fa-house"></i></button>
        <button title="Back Arrow" class="browser-button" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <button title="Forward Arrow" class="browser-button" onclick="goForward()"><i class="fa-solid fa-arrow-right"></i></button>
        <button title="Reload" onclick="reload()" class="browser-button"><i class="fa-solid fa-rotate-right"></i></button>
        <form id="fv" class="browser-post" method="POST">
          <input id="input" class="bar" placeholder="Search or enter a new URL" type="text" />
        </form>
      </div>
      <div class="browser-right">
        <a title="Spotify" id="spotify-button" class="spotify-browser-link" href="/spotify"><i class="fa-brands fa-spotify"></i><span>Spotify</span></a>
        <button title="Fullscreen" id="fullscreen-button" class="browser-button browser-button-right" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
        <button title="Window Popout" id="popout-button" class="browser-button browser-button-right" onclick="popoutTab()"><i class="fa-solid fa-up-right-from-square"></i></button>
        <button title="Inspect" class="browser-button browser-button-right" onclick="toggleDevTools()"><i class="fa-solid fa-code"></i></button>
        <button title="Tabs" id="tabs-button" class="browser-button browser-button-right"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      </div>
    </div>
  </div>
  <div class="frame-container" id="frame-container"></div>
  <script src="/assets/js/vendor.js"></script>
  <script src="/assets/js/search.js"></script>
  <script src="./assets/ultraviolet/uv.bundle.js"></script>
  <script src="./assets/ultraviolet/uv.config.js"></script>
  <script src="/assets/scramjet/scramjet.all.js"></script>
  <script src="/assets/scramjet/scramjet.config.js"></script>
  <script src="assets/js/tabs.js?v=lunar8"></script>
  <!-- DO NOT REMOVE-->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WKJQ5QHQTJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-WKJQ5QHQTJ");
  </script>
  <!-- DO NOT REMOVE-->
  <script src="/assets/js/lunar.js"></script>
</body>

</html>
