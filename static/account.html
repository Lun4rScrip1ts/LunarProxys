<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Lunar Account</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/nav.css">
  <link rel="stylesheet" href="/assets/css/lunar.css?v=lunar4">
  <link rel="stylesheet" href="/assets/css/community.css?v=lunar2">
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/main.js?v=lunar4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="lunar-community-page">
  <div class="nav-bar"></div>
  <main class="account-shell">
    <section class="account-card" id="auth-card">
      <div class="community-kicker"><i class="fa-solid fa-moon"></i> LUNAR ACCOUNT</div>
      <h1 id="auth-title">Welcome back</h1>
      <p id="auth-subtitle">Log in with your username or email.</p>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Log In</button>
        <button type="button" class="auth-tab" data-mode="register">Register</button>
      </div>
      <form id="auth-form" class="account-form">
        <label id="identifier-label">Username or email
          <input id="auth-identifier" autocomplete="username" maxlength="254" required>
        </label>
        <label id="register-username-row" hidden>Username
          <input id="auth-username" autocomplete="username" maxlength="20" minlength="4" pattern="[A-Za-z0-9_]{4,20}" placeholder="4–20 letters, numbers, or _">
          <small>4–20 characters. Letters, numbers, and underscores only.</small>
        </label>
        <label id="email-row" hidden>Email
          <input id="auth-email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com">
        </label>
        <label id="display-name-row" hidden>Display name
          <input id="auth-display-name" maxlength="20" placeholder="Up to 20 characters">
        </label>
        <label>Password
          <input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        </label>
        <button class="community-primary" type="submit" id="auth-submit">Log In</button>
        <p class="form-error" id="auth-error" role="alert"></p>
      </form>
    </section>

    <section class="account-card profile-card" id="profile-card" hidden>
      <div id="profile-background" class="profile-background"></div>
      <div class="profile-banner" id="profile-banner"></div>
      <div class="profile-heading">
        <div class="profile-avatar profile-avatar-large" id="profile-avatar"></div>
        <div>
          <div class="community-kicker">YOUR PROFILE</div>
          <h1 id="profile-display"></h1>
          <p id="profile-username"></p>
        </div>
      </div>

      <form id="profile-form" class="account-form">
        <label>Username<input id="profile-username-input" maxlength="20" minlength="4" pattern="[A-Za-z0-9_]{4,20}" required><small>4–20 characters.</small></label>
        <label>Email<input id="profile-email" type="email" maxlength="254" required></label>
        <div class="form-grid">
          <label>Username
            <input id="profile-username-input" maxlength="20" minlength="4" pattern="[A-Za-z0-9_]{4,20}" required>
            <small>4–20 characters. Letters, numbers, and underscores only.</small>
          </label>
          <label>Email
            <input id="profile-email" type="email" maxlength="254" required>
          </label>
        </div>
        <label>Display name
          <input id="profile-name" maxlength="20" required>
          <small>Up to 20 characters.</small>
        </label>

        <div class="upload-grid">
          <label class="upload-box">
            <span><i class="fa-solid fa-user"></i> Profile picture</span>
            <input id="profile-avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <small>PNG, JPG, WEBP, or GIF · max 8 MB</small>
          </label>
          <label class="upload-box">
            <span><i class="fa-solid fa-panorama"></i> Profile banner</span>
            <input id="profile-banner-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <small>Displayed at the top of your profile.</small>
          </label>
          <label class="upload-box">
            <span><i class="fa-solid fa-image"></i> Profile background</span>
            <input id="profile-background-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <small>Used behind your profile card.</small>
          </label>
        </div>

        <div class="form-grid">
          <label>Profile banner<input id="profile-banner-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>Optional profile banner.</small></label>
        <label>Profile background<input id="profile-background-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>Optional profile background.</small></label>
        <label>Status<input id="profile-status" maxlength="80" placeholder="Your status"></label>
          <label>Bio<input id="profile-bio" maxlength="160" placeholder="A short bio"></label>
        </div>

        <button class="community-primary" type="submit">Save Profile</button>
        <p class="form-success" id="profile-success"></p>
        <p class="form-error" id="profile-error" role="alert"></p>
      </form>

      <div class="account-actions">
        <a class="community-secondary" href="/chat"><i class="fa-solid fa-comments"></i> Open Global Chat</a>
        <button class="community-danger" id="logout-button" type="button">Log Out</button>
      </div>
    </section>
  </main>
  <script src="/assets/js/account.js?v=lunar2"></script>
</body>
</html>
