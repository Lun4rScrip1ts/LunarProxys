<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Lunar Chat</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/nav.css">
  <link rel="stylesheet" href="/assets/css/lunar.css?v=lunar3">
  <link rel="stylesheet" href="/assets/css/community.css?v=lunar1">
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/main.js?v=lunar3"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="lunar-community-page">
  <div class="nav-bar"></div>
  <main class="community-shell">
    <section class="community-header">
      <div>
        <span class="community-kicker"><i class="fa-solid fa-moon"></i> LUNAR COMMUNITY</span>
        <h1>Global Chat</h1>
        <p>Talk with other Lunar Proxy users. Messages are saved with their date and time.</p>
      </div>
      <a class="community-account-link" href="/account"><i class="fa-solid fa-user"></i><span id="community-account-label">Log in</span></a>
    </section>
    <section class="chat-card">
      <div class="chat-toolbar">
        <span><i class="fa-solid fa-comments"></i> Global Chat</span>
        <span id="chat-status">Connecting...</span>
      </div>
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
      <div id="chat-login-note" class="chat-login-note" hidden>
        <i class="fa-solid fa-lock"></i>
        <span>You need an account to send messages.</span>
        <a href="/account">Log in or register</a>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" maxlength="500" autocomplete="off" placeholder="Write a message..." aria-label="Message">
        <button type="submit" title="Send message"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </section>
  </main>
  <script src="/assets/js/community.js?v=lunar1"></script>
</body>
</html>
